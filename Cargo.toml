[package]
name = "meta-signal-energy-nexus"
version = "0.3.0"
edition = "2021"
rust-version = "1.89"

[features]
default = []
datom = ["dep:datom-codec", "dep:protos", "signal-energy-nexus/datom"]

[dependencies]
datom-codec = { git = "https://github.com/LiGoldragon/datom-codec", rev = "eabead4", optional = true }
protos = { git = "https://github.com/LiGoldragon/protos", rev = "3c7ade3", optional = true }
rkyv = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
signal = { git = "https://github.com/LiGoldragon/signal", rev = "7afb68bcd19ce774f47d11c5e69f6e10054f78de", default-features = false }
signal-energy-nexus = { git = "https://github.com/LiGoldragon/signal-energy-nexus", rev = "8f8f19ec3370279862b2fc05576ef18adabc48c8", default-features = false }

[dev-dependencies]
ethos-zero = { git = "https://github.com/LiGoldragon/ethos-zero", rev = "5a5daca", default-features = false }
