[package]
name = "meta-signal-energy-nexus"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"

[features]
default = []
datom = ["dep:datom-codec", "dep:protos", "signal-energy-nexus/datom"]

[dependencies]
datom-codec = { git = "https://github.com/LiGoldragon/datom-codec", rev = "4dff16b4f7412febc3b71aac8b49680cd20988cb", optional = true }
protos = { git = "https://github.com/LiGoldragon/protos", rev = "15b41da8f2579e73ead59bc0c2b97529b8ac32d3", optional = true }
rkyv = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
signal = { git = "https://github.com/LiGoldragon/signal", rev = "e0e3c05573405e793037205640e54cfd769bb1b4", default-features = false }
signal-energy-nexus = { git = "https://github.com/LiGoldragon/signal-energy-nexus", rev = "3c59145aa04b76cfbf139d49eb8cf9a4d8a02c04", default-features = false }
